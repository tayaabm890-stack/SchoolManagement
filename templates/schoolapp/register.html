
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Bright Future School</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        body {
            background: #f5f8fc;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #12355b;
        }

        .navbar-brand {
            color: white !important;
            font-weight: 700;
            font-size: 22px;
        }

        .register-box {
            max-width: 500px;
            margin: 70px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.10);
        }

        .register-icon {
            width: 70px;
            height: 70px;
            background: #eaf1f8;
            color: #12355b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
        }

        .register-title {
            color: #12355b;
            font-weight: 700;
        }

        .form-control {
            padding: 12px;
            border-radius: 8px;
        }

        .register-btn {
            background: #12355b;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            width: 100%;
            font-weight: 600;
        }

        .register-btn:hover {
            background: #0b2239;
            color: white;
        }

        .login-link {
            color: #12355b;
            font-weight: 600;
            text-decoration: none;
        }

    </style>

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar navbar-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            <i class="fa-solid fa-school"></i>
            Bright Future School
        </a>

    </div>

</nav>


<!-- REGISTER -->

<div class="container">

    <div class="register-box">

        <div class="register-icon">

            <i class="fa-solid fa-user-plus"></i>

        </div>


        <h2 class="text-center register-title">
            Create Account
        </h2>

        <p class="text-center text-muted mb-4">
            Register to access the school portal
        </p>


        {% if error %}

        <div class="alert alert-danger">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Username
                </label>

                
<div class="input-group">
    <input type="password" name="confirm_password" id="confirmPassword"
           class="form-control" placeholder="Confirm password" required>
    <button class="btn btn-outline-secondary" type="button"
            onclick="togglePassword('confirmPassword', this)">
        <i class="fa-solid fa-eye"></i>
    </button>
</div>
            </div>


            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter email address"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter password"
                    required
                >

            </div>


            <div class="mb-4">

                <label class="form-label fw-semibold">
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    class="form-control"
                    placeholder="Confirm password"
                    required
                >

            </div>


            <button type="submit" class="register-btn">

                <i class="fa-solid fa-user-check me-2"></i>

                Create Account

            </button>


        </form>


        <div class="text-center mt-4">

            <span class="text-muted">
                Already have an account?
            </span>
