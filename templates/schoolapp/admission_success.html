<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Application Submitted | Bright Future School</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

    body {
        background: #f5f7fb;
    }

    .success-box {
        max-width: 650px;
        margin: 100px auto;
        background: white;
        padding: 60px 35px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    .success-icon {
        font-size: 75px;
        color: #198754;
        margin-bottom: 25px;
    }

    h1 {
        color: #12355b;
        margin-bottom: 15px;
    }

    p {
        color: #687684;
        font-size: 17px;
    }

    .home-btn {
        display: inline-block;
        margin-top: 25px;
        background: #12355b;
        color: white;
        padding: 12px 28px;
        border-radius: 8px;
        text-decoration: none;
    }

    .home-btn:hover {
        color: white;
        background: #0d2947;
    }

</style>
```

</head>

<body>

```
<div class="container">

    <div class="success-box">

        <div class="success-icon">

            <i class="fa-solid fa-circle-check"></i>

        </div>

        <h1>Application Submitted!</h1>

        <p>
            Thank you for applying to Bright Future School.
            Your admission application has been successfully submitted.
        </p>

        <p>
            Our admission team will review your application

        </p>

        <a href="/" class="home-btn">

        </a>

    </div>
