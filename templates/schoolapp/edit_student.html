
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Student | Bright Future School</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        body {
            background: #f5f8fc;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #12355b;
        }

        .navbar-brand {
            color: white !important;
            font-weight: 700;
        }

        .edit-box {
            max-width: 850px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.10);
        }

        .page-title {
            color: #12355b;
            font-weight: 700;
        }

        .form-control,
        .form-select {
            padding: 11px;
            border-radius: 8px;
        }

        .save-btn {
            background: #12355b;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: 600;
        }

        .save-btn:hover {
            background: #0b2239;
            color: white;
        }

        .back-btn {
            background: #6c757d;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
        }

        .back-btn:hover {
            background: #545b62;
            color: white;
        }

        .current-photo {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 15px;
        }

    </style>

</head>


<body>


<nav class="navbar navbar-dark">

    <div class="container">

        <a class="navbar-brand"
           href="{% url 'home' %}">

            <i class="fa-solid fa-school me-2"></i>

            Bright Future School

        </a>

        <a href="{% url 'student_list' %}"
           class="btn btn-outline-light">

            <i class="fa-solid fa-users me-1"></i>

            Students

        </a>

    </div>

</nav>


<div class="container">

    <div class="edit-box">

        <h2 class="text-center page-title mb-2">

            <i class="fa-solid fa-user-pen me-2"></i>

            Edit Student

        </h2>

        <p class="text-center text-muted mb-4">

            Update {{ student.name }}'s information

        </p>


        <form method="POST"
              enctype="multipart/form-data">

            {% csrf_token %}


            <div class="row g-3">


                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Student Name
                    </label>

                    <input
    type="text"
    name="name"
    value="{{ student.name }}"
    class="form-control"
    maxlength="20"
    required
>

                </div>


                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Father's Name
                    </label>

                    <input
    type="text"
    name="father_name"
    value="{{ student.father_name }}"
    class="form-control"
    maxlength="20"
    required
>

                </div>


                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ student.email }}"
                    >

                </div>


                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Phone
                    </label>

                    <input
                        type="text"
                        name="phone"
                        class="form-control"
                        value="{{ student.phone }}"
                        required
                    >

                </div>


                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Date of Birth
                    </label>

                    <input
                        type="date"
                        name="date_of_birth"
                        class="form-control"
                        value="{{ student.date_of_birth|date:'Y-m-d' }}"
                        required
                    >

                </div>


                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Gender
                    </label>

                    <select
                        name="gender"
                        class="form-select"
                        required
                    >

                        <option value="Male"
                            {% if student.gender == 'Male' %}
                                selected
                            {% endif %}>
                            Male
                        </option>

                        <option value="Female"
                            {% if student.gender == 'Female' %}
                                selected
                            {% endif %}>
                            Female
                        </option>

                    </select>

                </div>


                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Class
                    </label>

                    <select
                        name="school_class"
                        class="form-select"
                    >

                        <option value="">
                            Select Class
                        </option>


                        {% for school_class in school_classes %}

                        <option
                            value="{{ school_class.id }}"
                            {% if student.school_class_id == school_class.id %}
                                selected
                            {% endif %}
                        >

                            {{ school_class }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Student Photo
                    </label>


                    {% if student.photo %}

                        <div>

                            <img
                                src="{{ student.photo.url }}"
                                class="current-photo"
                                alt="{{ student.name }}"
                            >

                        </div>

                    {% endif %}


                    <input
                        type="file"
                        name="photo"
                        class="form-control"
                    >

                </div>


                <div class="col-12">

                    <label class="form-label fw-semibold">
                        Address
                    </label>

                    <textarea
                        name="address"
                        class="form-control"
                        rows="4"
                        required
                    >{{ student.address }}</textarea>

                </div>


            </div>


            <div class="d-flex gap-2 justify-content-center mt-4">

                <a
                    href="{% url 'student_profile' student.id %}"
                    class="back-btn"
                >

                    <i class="fa-solid fa-arrow-left me-1"></i>

                    Cancel

                </a>


                <button
                    type="submit"
                    class="save-btn"
                >

                    <i class="fa-solid fa-floppy-disk me-1"></i>

                    Save Changes

                </button>

            </div>


        </form>

    </div>

</div>


</body>

</html>
