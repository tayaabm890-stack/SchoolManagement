
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Fee Structure</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #1769aa;
        }

        .navbar-brand {
            color: white !important;
        }

        .page-header {
            background: #1769aa;
            color: white;
            padding: 40px 20px;
            margin-bottom: 30px;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .fee-icon {
            color: #1769aa;
            font-size: 25px;
        }

        .btn-save {
            background: #1769aa;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
        }

        .btn-save:hover {
            background: #12558a;
            color: white;
        }

    </style>

</head>

<body>


<nav class="navbar">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="{% url 'home' %}"
        >

            <i class="fa-solid fa-school"></i>

            School Management

        </a>


        <div>

            <a
                href="{% url 'admin_dashboard' %}"
                class="btn btn-light btn-sm me-2"
            >
                Dashboard
            </a>

            <a
                href="{% url 'fee_structure_list' %}"
                class="btn btn-outline-light btn-sm"
            >
                Fee Structures
            </a>

        </div>

    </div>

</nav>


<div class="page-header">

    <div class="container">

        <h1>

            <i class="fa-solid fa-money-bill-wave"></i>

            Create Fee Structure

        </h1>

        <p class="mb-0">

            Set fees for a school class.

        </p>

    </div>

</div>


<div class="container mb-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="form-card">

                <form method="POST">

                    {% csrf_token %}


                    <!-- Class -->

                    <div class="mb-4">

                        <label class="form-label fw-bold">

                            School Class

                        </label>

                        <select
                            name="school_class"
                            class="form-select"
                            required
                        >

                            <option value="">

                                Select Class

                            </option>

                            {% for school_class in classes %}

                            <option value="{{ school_class.id }}">

                                {{ school_class.name }}
                                -
                                {{ school_class.section }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- Admission Fee -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">

                            <i class="fa-solid fa-file-circle-plus fee-icon"></i>

                            Admission Fee

                        </label>

                        <input
                            type="number"
                            name="admission_fee"
                            class="form-control"
                            min="0"
                            step="0.01"
                            value="0"
                            required
                        >

                    </div>


                    <!-- Monthly Fee -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">

                            <i class="fa-solid fa-calendar-days fee-icon"></i>

                            Monthly Fee

                        </label>

                        <input
                            type="number"
                            name="monthly_fee"
                            class="form-control"
                            min="0"
                            step="0.01"
                            value="0"
                            required
                        >

                    </div>


                    <!-- Exam Fee -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">

                            <i class="fa-solid fa-file-pen fee-icon"></i>

                            Exam Fee

                        </label>

                        <input
                            type="number"
                            name="exam_fee"
                            class="form-control"
                            min="0"
                            step="0.01"
                            value="0"
                            required
                        >

                    </div>


                    <!-- Other Fee -->

                    <div class="mb-4">

                        <label class="form-label fw-bold">

                            <i class="fa-solid fa-coins fee-icon"></i>

                            Other Fee

                        </label>

                        <input
                            type="number"
                            name="other_fee"
                            class="form-control"
                            min="0"
                            step="0.01"
                            value="0"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-save"
                    >

                        <i class="fa-solid fa-floppy-disk"></i>

                        Save Fee Structure

                    </button>


                    <a
                        href="{% url 'fee_structure_list' %}"
                        class="btn btn-outline-secondary"
                    >

                        View Fee Structures

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

</body>

</html>
