
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Bright Future School</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        body {
            background: #f5f8fc;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #12355b;
        }

        .navbar-brand {
            color: white !important;
            font-weight: 700;
            font-size: 22px;
        }

        .login-box {
            max-width: 450px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.10);
        }

        .login-icon {
            width: 70px;
            height: 70px;
            background: #eaf1f8;
            color: #12355b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
        }

        .login-title {
            color: #12355b;
            font-weight: 700;
        }

        .form-control {
            padding: 12px;
            border-radius: 8px;
        }

        .login-btn {
            background: #12355b;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            width: 100%;
            font-weight: 600;
        }

        .login-btn:hover {
            background: #0b2239;
            color: white;
        }

        .register-link {
            color: #12355b;
            font-weight: 600;
            text-decoration: none;
        }
        
.input-group .form-control {
    border-radius: 8px 0 0 8px;
}

.input-group .btn {
    border-radius: 0 8px 8px 0;
}

.input-group .form-control:focus {
    z-index: 1;
}

    </style>

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar navbar-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            <i class="fa-solid fa-school"></i>
            Bright Future School
        </a>

    </div>

</nav>


<!-- LOGIN -->

<div class="container">

    <div class="login-box">

        <div class="login-icon">

            <i class="fa-solid fa-right-to-bracket"></i>

        </div>


        <h2 class="text-center login-title">
            Welcome Back
        </h2>

        <p class="text-center text-muted mb-4">
            Login to your school account
        </p>


        {% if error %}

        <div class="alert alert-danger">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="mb-4">

                <label class="form-label fw-semibold">
                    Password
                </label>

                

<div class="input-group">
    <input
        type="password"
        name="password"
        id="loginPassword"
        class="form-control"
        placeholder="Enter password"
        required
    >

    <button
        type="button"
        id="togglePasswordBtn"
        class="btn btn-outline-secondary"
        onclick="togglePassword()"
        style="min-width: 55px;"
    >
        👁
    </button>

            </div>


            <button type="submit" class="login-btn">

                <i class="fa-solid fa-right-to-bracket me-2"></i>

                Login

            </button>


        </form>


        <div class="text-center mt-4">

            <span class="text-muted">
                Don't have an account?
            </span>

            <a href="{% url 'register' %}" class="register-link">
                Create Account
            </a>

        </div>

    </div>

</div>


<script>
function togglePassword() {
    const password = document.getElementById("loginPassword");
    const button = document.getElementById("togglePasswordBtn");

    if (password.type === "password") {
        password.type = "text";
        button.textContent = "🙈";
    } else {
        password.type = "password";
        button.textContent = "👁";
    }
}
</script>
</body>
</html>
