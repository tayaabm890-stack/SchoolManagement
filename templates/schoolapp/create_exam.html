
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Exam</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #1769aa;
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }

        .page-header {
            background: #1769aa;
            color: white;
            padding: 40px 20px;
            margin-bottom: 30px;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .btn-save {
            background: #1769aa;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
        }

        .btn-save:hover {
            background: #12558a;
            color: white;
        }

    </style>

</head>


<body>


<!-- Navbar -->

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="{% url 'home' %}"
        >

            <i class="fa-solid fa-school"></i>

            School Management

        </a>


        <div>

            <a
                href="{% url 'admin_dashboard' %}"
                class="btn btn-light btn-sm me-2"
            >

                Dashboard

            </a>

            <a
                href="{% url 'exam_list' %}"
                class="btn btn-outline-light btn-sm"
            >

                Exams

            </a>

        </div>

    </div>

</nav>


<!-- Header -->

<div class="page-header">

    <div class="container">

        <h1>

            <i class="fa-solid fa-file-pen"></i>

            Create Exam

        </h1>

        <p class="mb-0">

            Create a new examination for a school class.

        </p>

    </div>

</div>


<!-- Form -->

<div class="container mb-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="form-card">

                <form method="POST">

                    {% csrf_token %}


                    <!-- Exam Name -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">

                            Exam Name

                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            placeholder="Example: Mid Term Exam"
                            required
                        >

                    </div>


                    <!-- Class -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">

                            School Class

                        </label>

                        <select
                            name="school_class"
                            class="form-select"
                            required
                        >

                            <option value="">

                                Select Class

                            </option>


                            {% for school_class in classes %}

                            <option value="{{ school_class.id }}">

                                {{ school_class.name }}
                                -
                                {{ school_class.section }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- Dates -->

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label fw-bold">

                                Start Date

                            </label>

                            <input
                                type="date"
                                name="start_date"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label fw-bold">

                                End Date

                            </label>

                            <input
                                type="date"
                                name="end_date"
                                class="form-control"
                                required
                            >

                        </div>

                    </div>


                    <!-- Description -->

                    <div class="mb-4">

                        <label class="form-label fw-bold">

                            Description

                        </label>

                        <textarea
                            name="description"
                            class="form-control"
                            rows="4"
                            placeholder="Enter exam details..."
                        ></textarea>

                    </div>


                    <!-- Buttons -->

                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-save"
                        >

                            <i class="fa-solid fa-floppy-disk"></i>

                            Create Exam

                        </button>


                        <a
                            href="{% url 'exam_list' %}"
                            class="btn btn-outline-secondary"
                        >

                            View Exams

                        </a>

                    </div>


                </form>

            </div>

        </div>

    </div>

</div>


</body>

</html>
