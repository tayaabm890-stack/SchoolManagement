
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Enter Marks</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #1769aa;
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }

        .page-header {
            background: #1769aa;
            color: white;
            padding: 40px 20px;
            margin-bottom: 30px;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .btn-save {
            background: #1769aa;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
        }

        .btn-save:hover {
            background: #12558a;
            color: white;
        }

    </style>

</head>

<body>

<nav class="navbar">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="{% url 'home' %}"
        >

            <i class="fa-solid fa-school"></i>
            School Management

        </a>

        <div>

            <a
                href="{% url 'admin_dashboard' %}"
                class="btn btn-light btn-sm me-2"
            >
                Dashboard
            </a>

            <a
                href="{% url 'marks_list' %}"
                class="btn btn-outline-light btn-sm"
            >
                Marks
            </a>

        </div>

    </div>

</nav>


<div class="page-header">

    <div class="container">

        <h1>

            <i class="fa-solid fa-pen-to-square"></i>

            Enter Marks

        </h1>

        <p class="mb-0">

            Enter examination marks for students.

        </p>

    </div>

</div>


<div class="container mb-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="form-card">

                {% if error %}

                <div class="alert alert-danger">

                    <i class="fa-solid fa-circle-exclamation"></i>

                    {{ error }}

                </div>

                {% endif %}


                <form method="POST">

                    {% csrf_token %}


                    <!-- Exam -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">

                            Exam

                        </label>

                        <select
                            name="exam"
                            class="form-select"
                            required
                        >

                            <option value="">

                                Select Exam

                            </option>

                            {% for exam in exams %}

                            <option value="{{ exam.id }}">

                                {{ exam.name }}
                                -
                                {{ exam.school_class.name }}
                                {{ exam.school_class.section }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- Subject -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">

                            Subject

                        </label>

                        <select
                            name="subject"
                            class="form-select"
                            required
                        >

                            <option value="">

                                Select Subject

                            </option>

                            {% for subject in subjects %}

                            <option value="{{ subject.id }}">

                                {{ subject.name }}
                                -
                                {{ subject.school_class.name }}
                                {{ subject.school_class.section }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- Student -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">

                            Student

                        </label>

                        <select
                            name="student"
                            class="form-select"
                            required
                        >

                            <option value="">

                                Select Student

                            </option>

                            {% for student in students %}

                            <option value="{{ student.id }}">

                                {{ student.name }}

                                {% if student.school_class %}

                                -
                                {{ student.school_class.name }}
                                {{ student.school_class.section }}

                                {% endif %}

                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="row">

                        <!-- Total Marks -->

                        <div class="col-md-6 mb-3">

                            <label class="form-label fw-bold">

                                Total Marks

                            </label>

                            <input
                                type="number"
                                name="total_marks"
                                class="form-control"
                                min="1"
                                placeholder="Example: 100"
                                required
                            >

                        </div>


                        <!-- Obtained Marks -->

                        <div class="col-md-6 mb-3">

                            <label class="form-label fw-bold">

                                Obtained Marks

                            </label>

                            <input
                                type="number"
                                name="obtained_marks"
                                class="form-control"
                                min="0"
                                placeholder="Example: 85"
                                required
                            >

                        </div>

                    </div>


                    <div class="mt-3">

                        <button
                            type="submit"
                            class="btn btn-save"
                        >

                            <i class="fa-solid fa-floppy-disk"></i>

                            Save Marks

                        </button>


                        <a
                            href="{% url 'marks_list' %}"
                            class="btn btn-outline-secondary"
                        >

                            View Marks

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>

</html>
