
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ title }} | Bright Future School</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #1769aa;
        }

        .box {
            background: white;
            border-radius: 15px;
            padding: 50px;
            margin-top: 80px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

    </style>

</head>

<body>

<nav class="navbar navbar-dark">

    <div class="container">

        <a class="navbar-brand" href="{% url 'student_dashboard' %}">
            Bright Future School
        </a>

        <a href="{% url 'logout' %}" class="btn btn-outline-light">
            Logout
        </a>

    </div>

</nav>

<div class="container">

    <div class="box text-center">

        <h2 class="mb-3">
            {{ title }}
        </h2>

        <p class="text-muted">
            {{ message }}
        </p>

        <a
            href="{% url 'student_dashboard' %}"
            class="btn btn-primary"
        >
            Back to Dashboard
        </a>

    </div>

</div>

</body>

</html>
