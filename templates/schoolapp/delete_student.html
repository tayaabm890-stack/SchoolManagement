
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Delete Student | Bright Future School</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f5f8fc;
            font-family: Arial, sans-serif;
        }

        .delete-box {
            max-width: 500px;
            margin: 100px auto;
            background: white;
            padding: 40px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,0.10);
        }

        .warning-icon {
            font-size: 60px;
            color: #dc3545;
            margin-bottom: 20px;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: 600;
        }

        .cancel-btn {
            background: #6c757d;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
        }

        .cancel-btn:hover {
            color: white;
            background: #545b62;
        }

    </style>

</head>


<body>


<div class="container">

    <div class="delete-box">

        <div class="warning-icon">

            ⚠️

        </div>


        <h2>

            Delete Student?

        </h2>


        <p class="text-muted">

            Are you sure you want to delete

            <strong>{{ student.name }}</strong>?

        </p>


        <p class="text-danger">

            This action cannot be undone.

        </p>


        <form method="POST">

            {% csrf_token %}


            <div class="d-flex justify-content-center gap-2 mt-4">

                <a
                    href="{% url 'student_profile' student.id %}"
                    class="cancel-btn"
                >

                    Cancel

                </a>


                <button
                    type="submit"
                    class="delete-btn"
                >

                    Delete Student

                </button>

            </div>

        </form>

    </div>

</div>


</body>

</html>
