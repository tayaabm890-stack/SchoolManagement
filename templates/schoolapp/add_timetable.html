
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Timetable | Bright Future School</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card shadow border-0">

        <div class="card-body p-4">

            <h2 class="mb-4">
                <i class="fa-solid fa-clock"></i>
                Add Timetable
            </h2>

            <form method="POST">

                {% csrf_token %}

                <div class="row g-3">

                    <div class="col-md-6">

                        <label class="form-label">
                            Class
                        </label>

                        <select name="school_class"
                                class="form-select"
                                required>

                            <option value="">
                                Select Class
                            </option>

                            {% for item in classes %}

                            <option value="{{ item.id }}">
                                {{ item.name }} - {{ item.section }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Subject
                        </label>

                        <select name="subject"
                                class="form-select"
                                required>

                            <option value="">
                                Select Subject
                            </option>

                            {% for item in subjects %}

                            <option value="{{ item.id }}">
                                {{ item.name }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Teacher
                        </label>

                        <select name="teacher"
                                class="form-select">

                            <option value="">
                                Select Teacher
                            </option>

                            {% for teacher in teachers %}

                            <option value="{{ teacher.id }}">
                                {{ teacher.name }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Day
                        </label>

                        <select name="day"
                                class="form-select"
                                required>

                            <option value="">
                                Select Day
                            </option>

                            <option value="Monday">Monday</option>
                            <option value="Tuesday">Tuesday</option>
                            <option value="Wednesday">Wednesday</option>
                            <option value="Thursday">Thursday</option>
                            <option value="Friday">Friday</option>
                            <option value="Saturday">Saturday</option>

                        </select>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Start Time
                        </label>

                        <input type="time"
                               name="start_time"
                               class="form-control"
                               required>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            End Time
                        </label>

                        <input type="time"
                               name="end_time"
                               class="form-control"
                               required>

                    </div>

                </div>


                <div class="mt-4">

                    <button type="submit"
                            class="btn btn-success">

                        <i class="fa-solid fa-plus me-1"></i>
                        Add Timetable

                    </button>

                    <a href="{% url 'timetable_list' %}"
                       class="btn btn-secondary">

                        Back

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
