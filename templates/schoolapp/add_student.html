<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Add Student | Bright Future School</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

    body {
        background: #f5f8fc;
        font-family: Arial, sans-serif;
    }

    .navbar {
        background: #12355b;
    }

    .navbar-brand {
        color: white !important;
        font-weight: 700;
    }

    .page-header {
        background: #12355b;
        color: white;
        padding: 45px 20px;
        text-align: center;
    }

    .form-card {
        background: white;
        border-radius: 18px;
        padding: 35px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .form-label {
        font-weight: 600;
        color: #12355b;
    }

    .btn-save {
        background: #12355b;
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 8px;
    }

    .btn-save:hover {
        background: #0b2239;
        color: white;
    }

</style>
```

</head>

<body>

<nav class="navbar navbar-dark">

```
<div class="container">

    <a
        class="navbar-brand"
        href="{% url 'home' %}"
    >

        <i class="fa-solid fa-school me-2"></i>

        Bright Future School

    </a>

    <a
        href="{% url 'student_list' %}"
        class="btn btn-outline-light"
    >

        <i class="fa-solid fa-users me-1"></i>

        Students

    </a>

</div>
```

</nav>

<section class="page-header">

```
<h1>

    <i class="fa-solid fa-user-plus me-2"></i>

    Add New Student

</h1>

<p class="mb-0">

    Add a new student to Bright Future School

</p>
```

</section>

<div class="container py-5">

```
<div class="row justify-content-center">

    <div class="col-lg-9">

        <div class="form-card">

            <form
                method="POST"
                enctype="multipart/form-data"
            >

                {% csrf_token %}


                <div class="row g-3">


                    <!-- NAME -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Student Name

                        </label>

                       <input
    type="text"
    name="name"
    class="form-control"
    maxlength="20"
    required
>


                    <!-- FATHER NAME -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Father Name

                        </label>

                  <input
    type="text"
    name="father_name"
    class="form-control"
    maxlength="20"
    required
>
                    </div>


                    <!-- EMAIL -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Email

                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter email"
                        >

                    </div>


                    <!-- PHONE -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Phone

                        </label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            placeholder="Enter phone number"
                            required
                        >

                    </div>


                    <!-- DATE OF BIRTH -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Date of Birth

                        </label>

                        <input
                            type="date"
                            name="date_of_birth"
                            class="form-control"
                            required
                        >

                    </div>


                    <!-- GENDER -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Gender

                        </label>

                        <select
                            name="gender"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Gender
                            </option>

                            <option value="Male">
                                Male
                            </option>

                            <option value="Female">
                                Female
                            </option>

                        </select>

                    </div>


                    <!-- CLASS -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Class

                        </label>

                        <select
                            name="school_class"
                            class="form-select"
                        >

                            <option value="">
                                Select Class
                            </option>

                            {% for school_class in school_classes %}

                                <option
                                    value="{{ school_class.id }}"
                                >

                                    {{ school_class.name }}
                                    -
                                    {{ school_class.section }}

                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- PHOTO -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Student Photo

                        </label>

                        <input
                            type="file"
                            name="photo"
                            class="form-control"
                            accept="image/*"
                        >

                    </div>


                    <!-- ADDRESS -->

                    <div class="col-12">

                        <label class="form-label">

                            Address

                        </label>

                        <textarea
                            name="address"
                            class="form-control"
                            rows="4"
                            placeholder="Enter student address"
                            required
                        ></textarea>

                    </div>


                    <!-- BUTTONS -->

                    <div class="col-12 mt-4">

                        <a
                            href="{% url 'student_list' %}"
                            class="btn btn-secondary me-2"
                        >

                            <i class="fa-solid fa-arrow-left me-1"></i>

                            Back

                        </a>

                        <button
                            type="submit"
                            class="btn btn-save"
                        >

                            <i class="fa-solid fa-user-plus me-1"></i>

                            Add Student

                        </button>

                    </div>


                </div>

            </form>

        </div>

    </div>

</div>
```

</div>

</body>

</html>
