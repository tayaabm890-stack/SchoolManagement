
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fee Payment</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #1769aa;
        }

        .navbar-brand {
            color: white !important;
        }

        .page-header {
            background: #1769aa;
            color: white;
            padding: 40px 20px;
            margin-bottom: 30px;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .btn-save {
            background: #1769aa;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
        }

        .btn-save:hover {
            background: #12558a;
            color: white;
        }

    </style>

</head>

<body>


<nav class="navbar">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="{% url 'home' %}"
        >

            <i class="fa-solid fa-school"></i>

            School Management

        </a>


        <div>

            <a
                href="{% url 'admin_dashboard' %}"
                class="btn btn-light btn-sm me-2"
            >
                Dashboard
            </a>

            <a
                href="{% url 'fee_payment_list' %}"
                class="btn btn-outline-light btn-sm"
            >
                Payments
            </a>

        </div>

    </div>

</nav>


<div class="page-header">

    <div class="container">

        <h1>

            <i class="fa-solid fa-money-check-dollar"></i>

            Fee Payment

        </h1>

        <p class="mb-0">

            Record a student's fee payment.

        </p>

    </div>

</div>


<div class="container mb-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="form-card">

                <form method="POST">

                    {% csrf_token %}


                    <!-- Student -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">

                            Student

                        </label>

                        <select
                            name="student"
                            class="form-select"
                            required
                        >

                            <option value="">

                                Select Student

                            </option>

                            {% for student in students %}

                            <option value="{{ student.id }}">

                                {{ student.name }}

                                {% if student.school_class %}

                                -
                                {{ student.school_class.name }}
                                {{ student.school_class.section }}

                                {% endif %}

                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- Fee Structure -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">

                            Fee Structure

                        </label>

                        <select
                            name="fee_structure"
                            class="form-select"
                        >

                            <option value="">

                                Select Fee Structure

                            </option>

                            {% for fee in fee_structures %}

                            <option value="{{ fee.id }}">

                                {{ fee.school_class.name }}
                                -
                                {{ fee.school_class.section }}

                                | Monthly:
                                Rs. {{ fee.monthly_fee }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="row">


                        <!-- Month -->

                        <div class="col-md-6 mb-3">

                            <label class="form-label fw-bold">

                                Fee Month

                            </label>

                            <select
                                name="month"
                                class="form-select"
                                required
                            >

                                <option value="">

                                    Select Month

                                </option>

                                <option>January</option>
                                <option>February</option>
                                <option>March</option>
                                <option>April</option>
                                <option>May</option>
                                <option>June</option>
                                <option>July</option>
                                <option>August</option>
                                <option>September</option>
                                <option>October</option>
                                <option>November</option>
                                <option>December</option>

                            </select>

                        </div>


                        <!-- Amount -->

                        <div class="col-md-6 mb-3">

                            <label class="form-label fw-bold">

                                Amount

                            </label>

                            <input
                                type="number"
                                name="amount"
                                class="form-control"
                                min="0"
                                step="0.01"
                                placeholder="Example: 3000"
                                required
                            >

                        </div>

                    </div>


                    <!-- Payment Date -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">

                            Payment Date

                        </label>

                        <input
                            type="date"
                            name="payment_date"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="row">


                        <!-- Status -->

                        <div class="col-md-6 mb-3">

                            <label class="form-label fw-bold">

                                Status

                            </label>

                            <select
                                name="status"
                                class="form-select"
                                required
                            >

                                <option value="Paid">
                                    Paid
                                </option>

                                <option value="Pending">
                                    Pending
                                </option>

                            </select>

                        </div>


                        <!-- Payment Method -->

                        <div class="col-md-6 mb-3">

                            <label class="form-label fw-bold">

                                Payment Method

                            </label>

                            <select
                                name="payment_method"
                                class="form-select"
                                required
                            >

                                <option value="Cash">
                                    Cash
                                </option>

                                <option value="Bank">
                                    Bank
                                </option>

                                <option value="Online">
                                    Online
                                </option>

                            </select>

                        </div>

                    </div>


                    <!-- Notes -->

                    <div class="mb-4">

                        <label class="form-label fw-bold">

                            Notes

                        </label>

                        <textarea
                            name="notes"
                            class="form-control"
                            rows="3"
                            placeholder="Optional notes..."
                        ></textarea>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-save"
                    >

                        <i class="fa-solid fa-floppy-disk"></i>

                        Save Payment

                    </button>


                    <a
                        href="{% url 'fee_payment_list' %}"
                        class="btn btn-outline-secondary"
                    >

                        View Payments

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>


</body>

</html>
