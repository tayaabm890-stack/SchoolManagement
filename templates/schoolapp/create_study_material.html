
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Add Study Material - Bright Future School</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card shadow border-0">

        <div class="card-header text-white"
             style="background:#12355b;">

            <h3 class="mb-0">
                Add Study Material
            </h3>

        </div>

        <div class="card-body p-4">

            <form method="POST"
                  enctype="multipart/form-data">

                {% csrf_token %}

                <div class="row g-3">

                    <div class="col-12">

                        <label class="form-label">
                            Material Title
                        </label>

                        <input type="text"
                               name="title"
                               class="form-control"
                               placeholder="e.g. Mathematics Chapter 1"
                               required>

                    </div>


                    <div class="col-12">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea name="description"
                                  class="form-control"
                                  rows="4"></textarea>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Class
                        </label>

                        <select name="school_class"
                                class="form-select"
                                required>

                            <option value="">
                                Select Class
                            </option>

                            {% for item in classes %}

                            <option value="{{ item.id }}">
                                {{ item.name }} - {{ item.section }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Subject
                        </label>

                        <select name="subject"
                                class="form-select"
                                required>

                            <option value="">
                                Select Subject
                            </option>

                            {% for item in subjects %}

                            <option value="{{ item.id }}">
                                {{ item.name }} - {{ item.school_class }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="col-12">

                        <label class="form-label">
                            Upload File
                        </label>

                        <input type="file"
                               name="file"
                               class="form-control">

                        <small class="text-muted">
                            PDF, Word document, image, etc.
                        </small>

                    </div>


                    <div class="col-12">

                        <label class="form-label">
                            External Link
                        </label>

                        <input type="url"
                               name="link"
                               class="form-control"
                               placeholder="https://example.com">

                    </div>

                </div>


                <div class="mt-4">

                    <button type="submit"
                            class="btn text-white"
                            style="background:#12355b;">
                        Add Study Material
                    </button>

                    <a href="{% url 'study_material_list' %}"
                       class="btn btn-secondary">
                        View Materials
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
