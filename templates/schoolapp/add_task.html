
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Task | Bright Future School</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card shadow border-0">

        <div class="card-body p-4">

            <h2 class="mb-4">
                Add New Task
            </h2>

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Task Title
                    </label>

                    <input type="text"
                           name="title"
                           class="form-control"
                           placeholder="Enter task title"
                           required>

                </div>


                <div class="row g-3">

                    <div class="col-md-6">

                        <label class="form-label">
                            Class
                        </label>

                        <select name="school_class"
                                class="form-select"
                                required>

                            <option value="">
                                Select Class
                            </option>

                            {% for item in classes %}

                            <option value="{{ item.id }}">
                                {{ item.name }} - {{ item.section }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Subject
                        </label>

                        <select name="subject"
                                class="form-select">

                            <option value="">
                                Select Subject
                            </option>

                            {% for item in subjects %}

                            <option value="{{ item.id }}">
                                {{ item.name }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="col-md-12">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea name="description"
                                  class="form-control"
                                  rows="5"
                                  placeholder="Enter task details"></textarea>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Due Date
                        </label>

                        <input type="date"
                               name="due_date"
                               class="form-control"
                               required>

                    </div>

                </div>


                <div class="mt-4">

                    <button type="submit"
                            class="btn btn-success">

                        <i class="fa-solid fa-plus me-1"></i>
                        Add Task

                    </button>

                    <a href="{% url 'task_list' %}"
                       class="btn btn-secondary">

                        Back

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
