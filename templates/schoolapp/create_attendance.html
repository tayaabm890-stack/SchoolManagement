
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Attendance | Bright Future School</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
          rel="stylesheet">

    <style>

        body {
            font-family: 'DM Sans', sans-serif;
            background: #f5f7fb;
        }

        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
        }

        .navbar {
            background: #12355b;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 22px;
        }

        .page-header {
            background: linear-gradient(
                135deg,
                #12355b,
                #1c568f
            );
            color: white;
            padding: 55px 20px;
        }

        .page-header h1 {
            font-size: 40px;
        }

        .form-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.07);
        }

        .form-label {
            font-weight: 600;
            color: #34495e;
        }

        .form-control,
        .form-select {
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #dce2e8;
        }

        .submit-btn {
            background: #12355b;
            color: white;
            padding: 13px 30px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
        }

        .submit-btn:hover {
            background: #0d2947;
            color: white;
        }

        footer {
            background: #12355b;
            color: white;
            padding: 30px 0;
            margin-top: 70px;
        }

    </style>

</head>

<body>


<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            <i class="fa-solid fa-school me-2"></i>
            Bright Future School
        </a>

        <div class="ms-auto">

            <a href="{% url 'admin_dashboard' %}"
               class="btn btn-outline-light me-2">

                <i class="fa-solid fa-gauge me-1"></i>
                Dashboard

            </a>

            <a href="{% url 'logout' %}"
               class="btn btn-light">

                Logout

            </a>

        </div>

    </div>

</nav>


<section class="page-header">

    <div class="container">

        <h1>
            <i class="fa-solid fa-calendar-check me-2"></i>
            Create Attendance
        </h1>

        <p class="mb-0">
            Record attendance for a student.
        </p>

    </div>

</section>


<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-7">

                <div class="form-card">

                    <h3 class="mb-4"
                        style="color:#12355b;">

                        Attendance Information

                    </h3>


                    <form method="POST">

                        {% csrf_token %}


                        <div class="mb-4">

                            <label class="form-label">
                                Select Student
                            </label>

                            <select name="student"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Select Student
                                </option>

                                {% for student in students %}

                                <option value="{{ student.id }}">

                                    {{ student.name }}

                                    {% if student.school_class %}
                                        - {{ student.school_class.name }}
                                    {% endif %}

                                </option>

                                {% endfor %}

                            </select>

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Attendance Date
                            </label>

                            <input type="date"
                                   name="date"
                                   class="form-control"
                                   required>

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Attendance Status
                            </label>

                            <select name="status"
                                    class="form-select"
                                    required>

                                <option value="Present">
                                    Present
                                </option>

                                <option value="Absent">
                                    Absent
                                </option>

                            </select>

                        </div>


                        <div class="d-flex gap-2">

                            <button type="submit"
                                    class="submit-btn">

                                <i class="fa-solid fa-save me-2"></i>

                                Save Attendance

                            </button>

                            <a href="{% url 'attendance_list' %}"
                               class="btn btn-outline-secondary px-4">

                                View Attendance

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>


<footer>

    <div class="container text-center">

        <p class="mb-0">
            © 2026 Bright Future School. All Rights Reserved.
        </p>

    </div>

</footer>

</body>

</html>
